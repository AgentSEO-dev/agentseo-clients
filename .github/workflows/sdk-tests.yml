name: SDK retry safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-sdk:
    name: JavaScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ['18', '24.18.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/js-sdk/package-lock.json
      - run: npm ci --ignore-scripts --prefix packages/js-sdk
      - name: Retry identity tests (built artifact, mocked HTTP)
        run: npm test --prefix packages/js-sdk

  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml
      - name: Install local SDK artifact
        run: python -m pip install ./packages/python-sdk
      - name: Retry identity tests (mocked HTTP, no API key)
        run: python -m unittest discover -s packages/python-sdk/tests -v
